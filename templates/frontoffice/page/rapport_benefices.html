{% load i18n %}
<style>
.benefice-card {
    border: none;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
}
.benefice-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}
.kpi-card {
    border-radius: 12px;
    padding: 20px;
    color: white;
    margin-bottom: 20px;
}
.kpi-card.green  { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
.kpi-card.blue   { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
.kpi-card.orange { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
.kpi-card.purple { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.kpi-title { font-size: 0.85rem; opacity: 0.9; margin-bottom: 5px; }
.kpi-value { font-size: 1.8rem; font-weight: 700; }
.export-btn-excel { background: linear-gradient(135deg, #1e7e34 0%, #28a745 100%); color: white; border: none; border-radius: 10px; padding: 10px 20px; font-weight: 500; transition: all 0.2s ease; }
.export-btn-excel:hover { background: linear-gradient(135deg, #155724 0%, #1e7e34 100%); color: white; transform: scale(1.02); }
.export-btn-pdf   { background: linear-gradient(135deg, #bd2130 0%, #dc3545 100%); color: white; border: none; border-radius: 10px; padding: 10px 20px; font-weight: 500; transition: all 0.2s ease; }
.export-btn-pdf:hover { background: linear-gradient(135deg, #a71d2a 0%, #bd2130 100%); color: white; transform: scale(1.02); }
.badge-positif  { background: #d4edda; color: #155724; border-radius: 8px; padding: 3px 10px; font-size: 0.8rem; font-weight: 600; }
.badge-negatif  { background: #f8d7da; color: #721c24; border-radius: 8px; padding: 3px 10px; font-size: 0.8rem; font-weight: 600; }
.badge-neutre   { background: #e2e3e5; color: #383d41; border-radius: 8px; padding: 3px 10px; font-size: 0.8rem; font-weight: 600; }
#profit-table-wrapper { max-height: 500px; overflow-y: auto; }
</style>

<div class="container mt-4">
    <h1 class="page-title" style="font-size:2rem;font-weight:700;color:#2d3748;margin-bottom:30px;display:flex;align-items:center;gap:15px;">
        <i class="fas fa-coins" style="color:#11998e;"></i> Rapport des Bénéfices
    </h1>

    <!-- KPI Cards -->
    <div class="row" id="kpi-row">
        <div class="col-md-3"><div class="kpi-card green"><div class="kpi-title"><i class="fas fa-boxes"></i> Total produits</div><div class="kpi-value" id="kpi-total">—</div></div></div>
        <div class="col-md-3"><div class="kpi-card blue"><div class="kpi-title"><i class="fas fa-arrow-up"></i> Produits bénéficiaires</div><div class="kpi-value" id="kpi-positif">—</div></div></div>
        <div class="col-md-3"><div class="kpi-card orange"><div class="kpi-title"><i class="fas fa-arrow-down"></i> Produits déficitaires</div><div class="kpi-value" id="kpi-negatif">—</div></div></div>
        <div class="col-md-3"><div class="kpi-card purple"><div class="kpi-title"><i class="fas fa-coins"></i> Bénéfice total estimé</div><div class="kpi-value" id="kpi-benefice">—</div></div></div>
    </div>

    <!-- Export & Tableau -->
    <div class="card benefice-card mt-3">
        <div class="card-header d-flex justify-content-between align-items-center" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 18px 24px;">
            <h5 class="mb-0"><i class="fas fa-table"></i> Détail par produit</h5>
            <div class="d-flex gap-2">
                <button class="export-btn-excel btn" onclick="exportProfitReport('excel')">
                    <i class="fas fa-file-excel"></i> Export Excel
                </button>
                <button class="export-btn-pdf btn" onclick="exportProfitReport('pdf')">
                    <i class="fas fa-file-pdf"></i> Export PDF
                </button>
            </div>
        </div>
        <div class="card-body p-0">
            <div id="profit-table-wrapper">
                <div class="text-center py-5" id="profit-loading">
                    <div class="spinner-border text-success" role="status"></div>
                    <p class="text-muted mt-2">Calcul des bénéfices en cours…</p>
                </div>
                <div id="profit-table-container" style="display:none;"></div>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
'use strict';

async function loadProfitData() {
    try {
        const res = await fetch('/API/reports/profit-data/', { credentials: 'include' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        // KPIs
        const positif = data.products.filter(p => p.benefice_unit > 0).length;
        const negatif = data.products.filter(p => p.benefice_unit < 0).length;
        document.getElementById('kpi-total').textContent = data.count;
        document.getElementById('kpi-positif').textContent = positif;
        document.getElementById('kpi-negatif').textContent = negatif;
        document.getElementById('kpi-benefice').textContent = formatNum(data.total_benefice) + ' DA';

        // Tableau
        const rows = data.products.map(p => {
            const badgeClass = p.benefice_unit > 0 ? 'badge-positif' : (p.benefice_unit < 0 ? 'badge-negatif' : 'badge-neutre');
            const icon = p.benefice_unit > 0 ? '▲' : (p.benefice_unit < 0 ? '▼' : '—');
            return `<tr>
                <td style="padding:10px 14px;font-weight:500;">${p.reference}</td>
                <td style="padding:10px 14px;">${p.designation}</td>
                <td style="padding:10px 14px;text-align:right;">${formatNum(p.prix_vente)}</td>
                <td style="padding:10px 14px;text-align:right;">${formatNum(p.prix_achat_moy)}</td>
                <td style="padding:10px 14px;text-align:right;">
                    <span class="${badgeClass}">${icon} ${formatNum(p.benefice_unit)}</span>
                </td>
                <td style="padding:10px 14px;text-align:right;">${p.quantite_stock}</td>
                <td style="padding:10px 14px;text-align:right;font-weight:600;">${formatNum(p.benefice_total)}</td>
            </tr>`;
        }).join('');

        document.getElementById('profit-table-container').innerHTML = `
            <table class="table table-hover align-middle mb-0" data-no-datatable="true">
                <thead style="background:#f8f9fa;position:sticky;top:0;z-index:1;">
                    <tr>
                        <th style="padding:12px 14px;">Référence</th>
                        <th style="padding:12px 14px;">Désignation</th>
                        <th style="padding:12px 14px;text-align:right;">Prix Vente</th>
                        <th style="padding:12px 14px;text-align:right;">Prix Achat Moy.</th>
                        <th style="padding:12px 14px;text-align:right;">Bénéfice Unit.</th>
                        <th style="padding:12px 14px;text-align:right;">Qté Stock</th>
                        <th style="padding:12px 14px;text-align:right;">Bénéfice Total</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
                <tfoot>
                    <tr style="background:#f0fdf4;font-weight:700;">
                        <td colspan="6" style="padding:12px 14px;text-align:right;">BÉNÉFICE TOTAL ESTIMÉ</td>
                        <td style="padding:12px 14px;text-align:right;color:#11998e;">${formatNum(data.total_benefice)} DA</td>
                    </tr>
                </tfoot>
            </table>`;

        document.getElementById('profit-loading').style.display = 'none';
        document.getElementById('profit-table-container').style.display = 'block';

    } catch(e) {
        document.getElementById('profit-loading').innerHTML = `
            <div class="text-center py-4 text-danger">
                <i class="fas fa-exclamation-triangle fa-2x mb-2"></i>
                <p>Erreur de chargement : ${e.message}</p>
            </div>`;
    }
}

function formatNum(val) {
    if (val === null || val === undefined) return '0.00';
    return parseFloat(val).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

window.exportProfitReport = async function(format) {
    try {
        const res = await fetch(`/reports/profit/?format=${format}`, { credentials: 'include' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const cd = res.headers.get('Content-Disposition') || '';
        const m = /filename="?([^"]+)"?/.exec(cd);
        a.download = m ? m[1] : `rapport_benefices.${format === 'pdf' ? 'pdf' : 'xlsx'}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
    } catch(e) {
        alert('Erreur lors de l\'export : ' + e.message);
    }
};

loadProfitData();
})();
</script>

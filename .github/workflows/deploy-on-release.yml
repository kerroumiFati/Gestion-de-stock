name: Deploy on Release

# Se déclenche UNIQUEMENT lors de la création d'une release
# ou d'un tag version (ex: v1.0.0, v2.1.3)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'  # Exemple: v1.0.0, v2.1.3

jobs:
  deploy:
    name: Deploy Release to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION=${{ github.event.release.tag_name }}
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Déploiement de la version: $VERSION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Create backup with version tag
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "📦 Sauvegarde avant déploiement de $VERSION..."
          ssh -i ~/.ssh/deploy_key -p ${VPS_PORT} ${VPS_USERNAME}@${VPS_HOST} << EOF
            BACKUP_DIR="/home/gestionstock/backups"
            mkdir -p \${BACKUP_DIR}
            DATE=\$(date +%Y%m%d_%H%M%S)

            # Sauvegarder avec tag de version
            sudo -u postgres pg_dump gestion_stock_db > \${BACKUP_DIR}/db_${VERSION}_\${DATE}.sql
            tar -czf \${BACKUP_DIR}/media_${VERSION}_\${DATE}.tar.gz -C /home/gestionstock/app media/ 2>/dev/null || true

            echo "✓ Sauvegarde créée: \${BACKUP_DIR}/db_${VERSION}_\${DATE}.sql"
          EOF

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          echo "📤 Déploiement des fichiers..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT}" \
            --exclude='.git' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='db.sqlite3' \
            --exclude='media' \
            --exclude='staticfiles' \
            --exclude='venv' \
            --exclude='.github' \
            ./ ${VPS_USERNAME}@${VPS_HOST}:/home/gestionstock/app/

      - name: Install and update
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${VPS_PORT} ${VPS_USERNAME}@${VPS_HOST} << 'EOF'
            cd /home/gestionstock/app
            source venv/bin/activate

            echo "Installing dependencies..."
            pip install -r requirements.txt

            echo "Running migrations..."
            python manage.py migrate --noinput

            echo "Collecting static files..."
            python manage.py collectstatic --noinput

            # Enregistrer la version déployée
            echo "${{ steps.version.outputs.version }}" > /home/gestionstock/deployed_version.txt
            echo "✓ Version ${{ steps.version.outputs.version }} déployée"
          EOF

      - name: Restart application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${VPS_PORT} ${VPS_USERNAME}@${VPS_HOST} << 'EOF'
            sudo systemctl restart gestionstock
            sleep 3
            sudo systemctl status gestionstock --no-pager
          EOF

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f .env

      - name: Success notification
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Version ${{ steps.version.outputs.version }} déployée avec succès"
          echo "URL: http://${{ secrets.VPS_HOST }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
